name: Twice Daily Scrapers

on:
  schedule:
    - cron: "15 04,16 * * *"   # 04:15 & 16:15 UTC
  workflow_dispatch: {}        # allow manual run

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      MONGO_URI: ${{ secrets.MONGO_URI }}
      MONGO_DB: warrantdb
    strategy:
      fail-fast: false
      matrix:
        task:
          - name: brazoria
            cmd: >
              BRAZORIA_FIRST_LETTERS="A-Z" BRAZORIA_LETTERS="A-Z"
              BRAZORIA_APPEND_WILDCARD=true BRAZORIA_SINCE_DAYS=365
              PIPELINE_SOURCES="brazoria_jail" PIPELINE_STEPS="ingest"
              python -m scripts.run_pipeline
          - name: fortbend
            cmd: >
              FORTBEND_FIRST_LETTERS="A-Z" FORTBEND_LETTERS="A-Z"
              FORTBEND_APPEND_WILDCARD=true FORTBEND_SINCE_DAYS=365
              PIPELINE_SOURCES="fortbend_jail" PIPELINE_STEPS="ingest"
              python -m scripts.run_pipeline
          - name: jefferson
            cmd: >
              JEFF_MIN_LAST_LEN=3 JEFF_MIN_FIRST_LEN=0 JEFF_REQ_TIMEOUT=30
              JEFF_SURNAME_FILE="configs/jefferson_lastnames.txt"
              PIPELINE_SOURCES="jefferson_jail" PIPELINE_STEPS="ingest"
              python -m scripts.run_pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run ${{ matrix.task.name }}
        run: ${{ matrix.task.cmd }}