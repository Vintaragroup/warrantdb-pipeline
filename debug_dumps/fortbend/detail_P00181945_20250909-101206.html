    <script>

        // This javascript function is executed when the page loads
        $(document).ready(function () {

            // Set the source of the mugshot from the model
            // document.getElementById('Mugshot').src = ''; 
        });

        function sortTable(columnIndex) {
            var table = document.getElementById('BookingsTable');
            var rows = Array.from(table.rows);
            var headerRow = rows.shift();
            var sortOrder = headerRow.cells[columnIndex].getAttribute('data-sort-order') === 'asc' ? 'desc' : 'asc';

            rows.sort(function (a, b) {
                var cellA = a.cells[columnIndex].innerText;
                var cellB = b.cells[columnIndex].innerText;

                return sortOrder === 'asc' ? cellA.localeCompare(cellB) : cellB.localeCompare(cellA);
            });

            headerRow.cells[columnIndex].setAttribute('data-sort-order', sortOrder);
            table.tBodies[0].append(...rows);
        }

        document.addEventListener('DOMContentLoaded', function () {
            var headers = document.querySelectorAll('#InmatesTable thead th');
            headers.forEach(function (header, index) {
                header.addEventListener('click', function () {
                    sortTable(index);
                });
            });
        });

    </script>
